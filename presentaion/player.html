<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lecteur de Présentation | Deep Learning COVID-19</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="player-page">
  <div id="player-container">
    <div class="progress-container">
      <div class="progress-bar" id="progress-bar"></div>
    </div>

    <button class="fullscreen-btn" id="fullscreen-btn">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"></path>
      </svg>
      Plein Écran
    </button>

    <iframe id="slide-frame" src="slide1.html" allowfullscreen title="Slide actuelle"></iframe>

    <div class="controls" id="controls">
      <button class="nav-btn" id="prev-btn" title="Précédent (flèche gauche)">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <polyline points="15 18 9 12 15 6"></polyline>
        </svg>
      </button>

      <div class="slide-info" id="slide-info">1 / 30</div>

      <button class="nav-btn" id="next-btn" title="Suivant (flèche droite)">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <polyline points="9 18 15 12 9 6"></polyline>
        </svg>
      </button>
    </div>

    <div class="keyboard-hint">
      <h2>Utilisez les flèches pour naviguer</h2>
      <p>Flèche droite : slide suivante<br>Flèche gauche : slide précédente<br>F : plein écran</p>
    </div>
  </div>

  <script src="slides-data.js"></script>
  <script src="player.js"></script>
</body>
</html>
