<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>HAM10000 Model Explorer</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  </head>
  <body>
    <nav class="navbar navbar-expand-lg border-bottom bg-white">
      <div class="container">
        <a class="navbar-brand fw-semibold" href="{{ url_for('classify') }}">HAM10000 Models</a>
        <div class="navbar-nav flex-row gap-2">
          <a class="nav-link {% if active_page == 'classify' %}active{% endif %}" href="{{ url_for('classify') }}">Classifier</a>
          <a class="nav-link {% if active_page == 'generate' %}active{% endif %}" href="{{ url_for('generate') }}">Generate Samples</a>
        </div>
      </div>
    </nav>
    <main class="container py-4">
      <div class="device-line mb-3">Running on {{ device }}</div>
      {% block content %}{% endblock %}
    </main>
  </body>
</html>
