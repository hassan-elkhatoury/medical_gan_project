<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Lung Cancer Model Explorer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  </head>
  <body>
    <header class="topbar">
      <div class="container-xl topbar-inner">
        <a class="brand" href="{{ url_for('index') }}" aria-label="Lung Cancer Model Explorer home">
          <span class="brand-mark"><i data-lucide="microscope"></i></span>
          <span class="brand-copy">
            <span class="brand-title">Lung Cancer Explorer</span>
            <span class="brand-subtitle">GAN synthesis and CNN inference</span>
          </span>
        </a>

        <nav class="nav-tabs" aria-label="Primary navigation">
          <a class="nav-tab {% if active_page == 'home' %}active{% endif %}" href="{{ url_for('index') }}">
            <i data-lucide="layout-dashboard"></i><span>Home</span>
          </a>
          <a class="nav-tab {% if active_page == 'classify' %}active{% endif %}" href="{{ url_for('classify') }}">
            <i data-lucide="scan-search"></i><span>Classify</span>
          </a>
          <a class="nav-tab {% if active_page == 'generate' %}active{% endif %}" href="{{ url_for('generate') }}">
            <i data-lucide="sparkles"></i><span>Generate</span>
          </a>
        </nav>

        <div class="runtime-pill" title="PyTorch runtime">
          <span class="pulse"></span>{{ device }}
        </div>
      </div>
    </header>

    <main class="container-xl app-main">
      {% block content %}{% endblock %}
    </main>

    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
    <script>
      if (window.lucide) {
        window.lucide.createIcons({ strokeWidth: 1.8 });
      }
    </script>
    {% block scripts %}{% endblock %}
  </body>
</html>
